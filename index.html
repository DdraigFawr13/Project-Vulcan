<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledger</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #1c1a17;
        --hud: rgba(28, 26, 23, 0.88);
        --fg: #e9e2d4;
        --muted: #a39d8f;
        --on: #d79b62;
        --line: #3d3a33;
      }
      html,
      body,
      #game {
        margin: 0;
        height: 100%;
        background: var(--ink);
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #hud .hud {
        position: fixed;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--hud);
        color: var(--fg);
        font-size: 12px;
      }
      #hud button {
        font:
          600 12px/1 ui-monospace,
          monospace;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 4px;
        min-width: 32px;
        min-height: 28px;
        cursor: pointer;
      }
      #hud button:focus-visible {
        outline: 2px solid var(--on);
      }
      #hud button[aria-pressed='true'] {
        background: var(--on);
        border-color: var(--on);
        color: var(--ink);
      }
      .bar {
        top: 0;
        left: 0;
        right: 0;
        padding: 6px max(8px, env(safe-area-inset-right)) 6px max(8px, env(safe-area-inset-left));
        justify-content: space-between;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--line);
      }
      .clock {
        font:
          600 12px/1.2 ui-monospace,
          monospace;
      }
      .clock small {
        display: block;
        font:
          400 11px/1.2 system-ui,
          sans-serif;
        color: var(--muted);
      }
      .status,
      .speeds {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .pill {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 4px 6px;
        border-radius: 3px;
        background: var(--on);
        color: var(--ink);
        margin-right: 4px;
      }
      .readout {
        left: 8px;
        bottom: max(8px, env(safe-area-inset-bottom));
        padding: 6px 8px;
        border-radius: 4px;
        font-family: ui-monospace, monospace;
      }
      .debug {
        right: 8px;
        bottom: max(8px, env(safe-area-inset-bottom));
        padding: 4px 6px;
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        color: var(--muted) !important;
        z-index: 2;
      }
      .zoom {
        right: 8px;
        bottom: calc(max(8px, env(safe-area-inset-bottom)) + 30px);
        flex-direction: column;
        gap: 0 !important;
        border-radius: 4px;
      }
      .zoom button {
        border: 0 !important;
        font-size: 16px !important;
        color: var(--fg) !important;
      }
      .screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px;
        text-align: center;
        background: var(--ink);
        color: var(--muted);
        z-index: 3;
      }
      .screen b {
        font:
          700 20px/1.2 Georgia,
          serif;
        color: var(--fg);
      }
      .screen button {
        color: var(--on) !important;
        border-color: var(--on) !important;
        padding: 6px 12px;
      }
      #hud button.word {
        font-family: system-ui, sans-serif;
        padding: 0 8px;
      }
      .panel {
        position: fixed;
        top: 52px;
        right: 0;
        /* Leaves the zoom buttons and the debug line (fps, tick) uncovered below it. */
        max-height: calc(100% - 52px - 96px);
        width: min(360px, 40vw);
        z-index: 1;
        border-bottom: 1px solid var(--line);
        border-bottom-left-radius: 8px;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 10px 12px max(12px, env(safe-area-inset-bottom));
        background: var(--hud);
        color: var(--fg);
        border-left: 1px solid var(--line);
        font-size: 13px;
        line-height: 1.4;
        display: grid;
        align-content: start;
        gap: 8px;
      }
      @media (max-width: 640px) {
        .panel {
          top: auto;
          left: 0;
          bottom: 0;
          width: auto;
          max-height: 60vh;
          /* The debug line stays readable over the sheet's foot. */
          padding-bottom: calc(max(8px, env(safe-area-inset-bottom)) + 30px);
          border-left: 0;
          border-bottom: 0;
          border-top: 1px solid var(--line);
          border-radius: 12px 12px 0 0;
        }
        /* The sheet covers the zoom buttons' corner; pinch still zooms while it is open. */
        #hud:has(.panel:not([hidden])) .zoom {
          display: none;
        }
      }
      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .panel h2 {
        margin: 0;
        font:
          700 16px/1.2 Georgia,
          serif;
      }
      .panel-body {
        display: grid;
        gap: 8px;
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 0;
        font:
          12px/1.4 ui-monospace,
          monospace;
      }
      .kv dt,
      .muted,
      .when,
      .save .meta span {
        color: var(--muted);
      }
      .kv dd {
        margin: 0;
      }
      .muted,
      .problem {
        margin: 0;
      }
      .problem {
        color: #e08a78;
      }
      .line {
        display: grid;
        gap: 2px;
        border-top: 1px solid var(--line);
        padding-top: 6px;
      }
      .when {
        font:
          11px/1.2 ui-monospace,
          monospace;
      }
      #hud .why {
        all: unset;
        cursor: pointer;
        color: var(--on);
        font-weight: 600;
        text-decoration: underline;
      }
      .chain {
        margin-left: 4px;
        padding-left: 8px;
        border-left: 2px solid var(--on);
        display: grid;
        gap: 4px;
      }
      .chain .line {
        border: 0;
        padding: 0;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .row input {
        flex: 1;
        min-width: 0;
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      #hud .panel button {
        font-family: system-ui, sans-serif;
        color: var(--on);
        border-color: var(--on);
        padding: 0 10px;
      }
      #hud .panel button.solid {
        background: var(--on);
        color: var(--ink);
      }
      #hud .panel button.dim,
      #hud .panel-head button {
        color: var(--muted);
        border-color: var(--line);
      }
      .save {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 8px;
        align-items: start;
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      .thumb {
        width: 56px;
        height: 40px;
        object-fit: cover;
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .save .meta {
        display: grid;
        gap: 4px;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .tag {
        font:
          600 10px/1 ui-monospace,
          monospace;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 2px 4px;
        margin-left: 6px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main id="game" data-testid="game" aria-label="Map"></main>
    <div id="hud"></div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
