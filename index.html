<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledger</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #1c1a17;
        --hud: rgba(28, 26, 23, 0.88);
        --fg: #e9e2d4;
        --muted: #a39d8f;
        --on: #d79b62;
        --line: #3d3a33;
        --warn: #c4573a;
      }
      html,
      body,
      #game {
        margin: 0;
        height: 100%;
        background: var(--ink);
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #hud .hud {
        position: fixed;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--hud);
        color: var(--fg);
        font-size: 12px;
      }
      #hud button {
        font:
          600 12px/1 ui-monospace,
          monospace;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 4px;
        min-width: 32px;
        min-height: 28px;
        cursor: pointer;
      }
      #hud button:focus-visible {
        outline: 2px solid var(--on);
      }
      #hud button[aria-pressed='true'] {
        background: var(--on);
        border-color: var(--on);
        color: var(--ink);
      }
      .bar {
        top: 0;
        left: 0;
        right: 0;
        padding: 6px max(8px, env(safe-area-inset-right)) 6px max(8px, env(safe-area-inset-left));
        justify-content: space-between;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--line);
      }
      .clock {
        font:
          600 12px/1.2 ui-monospace,
          monospace;
      }
      .clock small {
        display: block;
        font:
          400 11px/1.2 system-ui,
          sans-serif;
        color: var(--muted);
      }
      .status,
      .speeds {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      /* On a phone the panel buttons wrap under the speeds until P2.8's ⋯ menu takes Region and
         Saves (UI_STYLE.md); the camera keeps the map clear of the taller bar. */
      .status {
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .pill {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 4px 6px;
        border-radius: 3px;
        background: var(--on);
        color: var(--ink);
        margin-right: 4px;
      }
      .readout {
        left: 8px;
        bottom: max(8px, env(safe-area-inset-bottom));
        padding: 6px 8px;
        border-radius: 4px;
        font-family: ui-monospace, monospace;
      }
      .debug {
        right: 8px;
        bottom: max(8px, env(safe-area-inset-bottom));
        padding: 4px 6px;
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        color: var(--muted) !important;
        z-index: 2;
      }
      .zoom {
        right: 8px;
        bottom: calc(max(8px, env(safe-area-inset-bottom)) + 30px);
        flex-direction: column;
        gap: 0 !important;
        border-radius: 4px;
      }
      .zoom button {
        border: 0 !important;
        font-size: 16px !important;
        color: var(--fg) !important;
      }
      .zoom button:disabled {
        opacity: 0.35;
      }
      .zoom .level {
        padding: 2px 0;
        text-align: center;
        font:
          600 12px ui-monospace,
          monospace;
        color: var(--on);
        border-block: 1px solid var(--line);
      }
      /* A level nobody has reached: dark, with a note in the middle. */
      .unreached {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0 64px;
        text-align: center;
        color: var(--muted);
        pointer-events: none;
      }
      .unreached[hidden] {
        display: none;
      }
      .unreached b {
        font:
          700 16px/1.2 Georgia,
          serif;
        color: var(--fg);
      }
      .screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px;
        text-align: center;
        background: var(--ink);
        color: var(--muted);
        z-index: 3;
      }
      .screen b {
        font:
          700 20px/1.2 Georgia,
          serif;
        color: var(--fg);
      }
      .screen button {
        color: var(--on) !important;
        border-color: var(--on) !important;
        padding: 6px 12px;
      }
      #hud button.word {
        font-family: system-ui, sans-serif;
        padding: 0 8px;
      }
      .panel {
        position: fixed;
        top: 52px;
        right: 0;
        /* Leaves the level and zoom buttons (and the debug line) uncovered below it. */
        max-height: calc(100% - 52px - 200px);
        width: min(360px, 40vw);
        z-index: 1;
        border-bottom: 1px solid var(--line);
        border-bottom-left-radius: 8px;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 10px 12px max(12px, env(safe-area-inset-bottom));
        background: var(--hud);
        color: var(--fg);
        border-left: 1px solid var(--line);
        font-size: 13px;
        line-height: 1.4;
        display: grid;
        align-content: start;
        gap: 8px;
      }
      @media (max-width: 640px) {
        .panel {
          top: auto;
          left: 0;
          bottom: 0;
          width: auto;
          max-height: 60vh;
          padding-bottom: max(12px, env(safe-area-inset-bottom));
          border-left: 0;
          border-bottom: 0;
          border-top: 1px solid var(--line);
          border-radius: 12px 12px 0 0;
        }
        /* The sheet covers the zoom buttons' corner; pinch still zooms while it is open. The tile
           readout and the debug line would sit on the sheet's foot, so they go too. */
        #hud:has(.panel:not([hidden])) :is(.zoom, .readout, .debug) {
          display: none;
        }
      }
      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .panel h2 {
        margin: 0;
        font:
          700 16px/1.2 Georgia,
          serif;
      }
      .panel-body {
        display: grid;
        gap: 8px;
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 0;
        font:
          12px/1.4 ui-monospace,
          monospace;
      }
      .kv dt,
      .muted,
      .when,
      .save .meta span {
        color: var(--muted);
      }
      .kv dd {
        margin: 0;
      }
      .muted,
      .problem {
        margin: 0;
      }
      .problem {
        color: #e08a78;
      }
      .line {
        display: grid;
        gap: 2px;
        border-top: 1px solid var(--line);
        padding-top: 6px;
      }
      .when {
        font:
          11px/1.2 ui-monospace,
          monospace;
      }
      #hud .why {
        all: unset;
        cursor: pointer;
        color: var(--on);
        font-weight: 600;
        text-decoration: underline;
      }
      .chain {
        margin-left: 4px;
        padding-left: 8px;
        border-left: 2px solid var(--on);
        display: grid;
        gap: 4px;
      }
      .chain .line {
        border: 0;
        padding: 0;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .row input {
        flex: 1;
        min-width: 0;
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      #hud .panel button {
        font-family: system-ui, sans-serif;
        color: var(--on);
        border-color: var(--on);
        padding: 0 10px;
      }
      #hud .panel button.solid {
        background: var(--on);
        color: var(--ink);
      }
      #hud .panel button.dim,
      #hud .panel-head button {
        color: var(--muted);
        border-color: var(--line);
      }
      .save {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 8px;
        align-items: start;
        border-top: 1px solid var(--line);
        padding-top: 8px;
      }
      .thumb {
        width: 56px;
        height: 40px;
        object-fit: cover;
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .save .meta {
        display: grid;
        gap: 4px;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .tag {
        font:
          600 10px/1 ui-monospace,
          monospace;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 2px 4px;
        margin-left: 6px;
      }
      [hidden] {
        display: none !important;
      }
      /* The site picker and the region map (P1.5). */
      .picker {
        position: fixed;
        inset: 0;
        z-index: 4;
        overflow-y: auto;
        background: var(--ink);
        color: var(--fg);
        font-size: 13px;
        padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        box-sizing: border-box;
      }
      .picker .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 8px;
      }
      .picker .top b,
      .vhead b {
        font:
          700 18px/1.2 Georgia,
          serif;
        display: block;
      }
      .picker .top small,
      .picker .mut,
      .picker .note,
      .legend {
        color: var(--muted);
      }
      .note {
        white-space: pre-line;
      }
      #hud .picker button {
        font-family: system-ui, sans-serif;
        color: var(--on);
        border-color: var(--on);
        padding: 0 10px;
        min-height: 32px;
      }
      #hud .picker button.settle {
        background: var(--on);
        color: var(--ink);
        width: 100%;
        min-height: 40px;
        font-weight: 600;
      }
      #hud .picker button.ghost {
        color: var(--muted);
        border-color: var(--line);
        width: 100%;
      }
      .picker .body {
        display: grid;
        gap: 10px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .picker .main,
      .picker .side {
        min-width: 0;
      }
      .rmap svg {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 6px;
        background: #2a2a24;
      }
      .rmap .lab {
        font:
          600 8.5px system-ui,
          sans-serif;
        fill: #f3ecdc;
        stroke: #1c1a17;
        stroke-width: 2px;
        paint-order: stroke;
      }
      .rmap .geo {
        font:
          italic 8.5px Georgia,
          serif;
        fill: #efe3c8;
        stroke: #2a261f;
        stroke-width: 2px;
        paint-order: stroke;
      }
      .rmap .river {
        fill: #cfe2f2;
      }
      .rmap .glyph {
        stroke: #1c1a17;
        stroke-width: 0.8;
        paint-order: stroke;
      }
      .rmap .site,
      .rmap .valley {
        cursor: pointer;
        outline: none;
      }
      .rmap .ring {
        fill: #1c1a17;
        stroke: var(--on);
        stroke-width: 1.6;
      }
      .rmap .valley.on .ring {
        fill: var(--on);
      }
      .rmap .num {
        font:
          700 10px system-ui,
          sans-serif;
        fill: var(--on);
      }
      .rmap .valley.on .num {
        fill: #1c1a17;
      }
      .rmap .site:focus-visible circle,
      .rmap .valley:focus-visible circle:first-child {
        stroke: var(--on);
        stroke-width: 1;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        font-size: 12px;
        padding: 6px 0;
      }
      .legend i {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        margin-right: 4px;
      }
      .picker .cards {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding-bottom: 6px;
      }
      .vcard {
        flex: 0 0 82%;
        scroll-snap-align: start;
        display: grid;
        gap: 3px;
        align-content: start;
        background: #26231e;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px 10px;
      }
      .vcard.on {
        border-color: var(--on);
      }
      .vcard ul {
        margin: 4px 0;
        padding-left: 16px;
      }
      .vthumb {
        width: 100%;
        max-height: 200px;
        aspect-ratio: 1;
        object-fit: contain;
        image-rendering: pixelated;
        background: #151412;
        border-radius: 4px;
      }
      .vhead {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .badge {
        display: inline-grid;
        place-items: center;
        flex: 0 0 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--on);
        color: var(--ink);
        font-weight: 700;
        font-size: 12px;
      }
      .picker .foot {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .picker .foot input {
        flex: 1;
        min-width: 0;
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 8px;
        font:
          13px ui-monospace,
          monospace;
      }
      @media (min-width: 900px) {
        .picker .body {
          grid-template-columns: 3fr 2fr;
        }
        .picker .cards {
          flex-direction: column;
          overflow: visible;
        }
        .vcard {
          flex: none;
          grid-template-columns: 120px 1fr;
          column-gap: 10px;
        }
        .vcard > :not(.vthumb) {
          grid-column: 2;
        }
        .vthumb {
          grid-row: 1 / span 8;
        }
      }
      /* P2.1: the title and arrival screens cover the game; its bar and buttons hide under them. */
      #hud.covered > :not(.title):not(.arrival) {
        display: none !important;
      }
      .title,
      .arrival {
        position: fixed;
        inset: 0;
        z-index: 4;
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      .title {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        background: rgba(20, 19, 17, 0.55);
      }
      .title.plain {
        background: var(--ink);
      }
      .title .logo {
        font:
          700 46px/1 Georgia,
          serif;
      }
      .title .wt {
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 22px;
      }
      .title .tnote {
        max-width: 300px;
        color: var(--muted);
        font-size: 14px;
        margin: 0;
      }
      #hud button.big {
        width: 100%;
        max-width: 300px;
        min-height: 48px;
        padding: 10px 14px;
        border-radius: 8px;
        font:
          600 17px/1.2 system-ui,
          sans-serif;
        color: var(--fg);
        background: rgba(35, 33, 29, 0.94);
      }
      #hud button.big small {
        display: block;
        font-weight: 400;
        font-size: 13px;
        color: var(--muted);
        margin-top: 3px;
      }
      #hud button.big.primary {
        background: var(--on);
        border-color: var(--on);
        color: var(--ink);
      }
      #hud button.big.primary small {
        color: #3b2a18;
      }
      #hud button.big:disabled {
        opacity: 0.7;
        cursor: wait;
      }
      .arrival {
        display: flex;
        flex-direction: column;
        background: rgba(20, 19, 17, 0.92);
        max-width: 720px;
        margin: 0 auto;
      }
      .ahead {
        padding: max(18px, env(safe-area-inset-top)) 16px 8px;
        display: grid;
        gap: 4px;
      }
      .ahead .k {
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--on);
        font-weight: 700;
      }
      .ahead h2 {
        margin: 0;
        font:
          700 26px/1.15 Georgia,
          serif;
      }
      .ahead p {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
      }
      .arrival .cards {
        flex: 1;
        overflow-y: auto;
        padding: 4px 12px 12px;
        display: grid;
        gap: 8px;
        align-content: start;
      }
      .pcard {
        display: grid;
        grid-template-columns: 64px 1fr;
        gap: 10px;
        background: #26231f;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
      }
      .portrait {
        image-rendering: pixelated;
        background: #3f4a2a;
        border-radius: 6px;
      }
      .pname {
        font-weight: 700;
        font-size: 15px;
      }
      .badge {
        display: inline-block;
        margin-left: 6px;
        padding: 0 5px;
        border-radius: 4px;
        font-size: 11px;
        background: var(--on);
        color: var(--ink);
        vertical-align: 1px;
      }
      .pwho,
      .ptraits {
        font-size: 12.5px;
        color: var(--muted);
        margin: 2px 0;
      }
      .skills {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 8px;
        align-items: center;
        font-size: 12px;
        margin: 4px 0;
      }
      .skills.numbers.need {
        grid-template-columns: 6.5em 1fr 7.5em;
      }
      .need .n {
        text-align: right;
      }
      .need.low .sbar i {
        background: var(--warn);
      }
      .need.low .n {
        color: var(--warn);
      }
      .skills.numbers {
        grid-template-columns: auto 1fr auto;
      }
      .sbar {
        position: relative;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
      }
      .sbar i {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 3px;
        background: var(--on);
      }
      .sbar b {
        position: absolute;
        top: -2px;
        bottom: -2px;
        width: 2px;
        background: var(--fg);
        opacity: 0.7;
      }
      .arrival .more {
        position: relative;
        height: 0;
        text-align: center;
        font-size: 12px;
      }
      .arrival .more::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 48px;
        background: linear-gradient(transparent, rgba(20, 19, 17, 0.95));
        pointer-events: none;
      }
      .arrival .more:not([hidden]) {
        display: block;
        transform: translateY(-22px);
      }
      .arrival .more span {
        position: relative;
        padding: 3px 10px;
        border-radius: 10px;
        background: #23211d;
        border: 1px solid var(--line);
      }
      .afoot {
        display: grid;
        gap: 8px;
        padding: 10px 16px max(16px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: #23211d;
      }
      .afoot .ok {
        font-size: 12.5px;
        color: var(--muted);
      }
      #hud .afoot button.big {
        max-width: none;
      }
      .prow {
        min-height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-top: 1px solid var(--line);
        font-size: 13px;
      }
      #hud .panel-head button {
        min-width: 44px;
        min-height: 44px;
      }
      @media (min-width: 720px) {
        .arrival .cards {
          grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main id="game" data-testid="game" aria-label="Map"></main>
    <div id="hud"></div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
