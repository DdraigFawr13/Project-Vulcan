name: CI

# Two parallel jobs, matching Story-Generator's CI:
#   core:    `npm run check` (AI-master drift, format, typecheck, boundaries, size limits,
#            code map, reading cost, unit tests, build)
#   browser: the Chromium smoke (tests/browser) against the production build
#
# When it runs (Morgan, 2026-10-17; RULES VR-54): once, when a PR is marked ready for review.
# Draft PRs never run CI; threads run `npm run check` and the browser smoke locally instead.
# A push to a PR that is already ready runs it again, so PRs stay draft until the work is done.
# No run on `main` after a merge: the squash commit is the code CI already passed.
# `workflow_dispatch` runs it by hand from the Actions tab.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per PR or branch; a newer commit cancels the older run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      # The same steps as a local `npm run check`; its step timings go to the job summary.
      - run: npm run check

  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      # The Chromium download is cached per Playwright version; its system packages are not.
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:browser -- --forbid-only
