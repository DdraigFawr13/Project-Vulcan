name: CI

# Two parallel jobs, matching Story-Generator's CI:
#   core:    `npm run check:full` (AI-master drift, format, typecheck, boundaries, size limits,
#            code map, reading cost, unit tests, build)
#   browser: the browser tests (tests/browser) against the production build, in Playwright's image
#
# When it runs (Morgan, 2026-10-17; RULES VR-54): once, when a PR is marked ready for review.
# Draft PRs never run CI; threads run `npm run check` and the browser smoke locally instead.
# A push to a PR that is already ready runs it again, so PRs stay draft until the work is done.
# No run on `main` after a merge: the squash commit is the code CI already passed.
# `workflow_dispatch` runs it by hand from the Actions tab.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per PR or branch; a newer commit cancels the older run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      # The same steps as a local `npm run check:full` (every test file, RULES VR-67); its step
      # timings go to the job summary.
      - run: npm run check:full

  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Playwright's own image holds Chromium and its system packages, so nothing is installed per
    # run. A cache could not do this: CI never runs on `main`, and a pull request's cache is seen
    # only by that pull request, so the old Chromium cache missed on every run and its install took
    # 18 s to 4 min 56 s (audit 2026-11-18 F1). The tag must match `@playwright/test` in
    # package.json; the version step fails, naming both, when they differ.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      PLAYWRIGHT_IMAGE_VERSION: 1.64.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Playwright image matches package.json
        run: >-
          node -e "const v = require('@playwright/test/package.json').version;
          if (v !== process.env.PLAYWRIGHT_IMAGE_VERSION) {
          console.error('ci.yml runs Playwright image ' + process.env.PLAYWRIGHT_IMAGE_VERSION + ' but @playwright/test is ' + v);
          process.exit(1); }"
      - run: npm run test:browser -- --forbid-only
      # A failed test keeps its trace (playwright.config.ts); upload it so the page at the failure
      # can be seen, since a CI-only failure may not reproduce locally.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
